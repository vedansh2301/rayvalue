# IndexNow (Bing, Yandex, Seznam, Naver) after every push to main (= a production deploy; waits for it to go live)
# and every 30 minutes. Pages render on demand from Supabase, so a value edited in the Table Editor changes pages
# without a deploy; the 30-minute run catches those. The fingerprints submitted last time live in the Actions cache,
# so only changed / new / removed pages are sent. (Vercel does not report this project's deploys to GitHub, so there
# is no deployment_status event to hook.)
name: IndexNow

on:
  push:
    branches: [main]
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    concurrency:
      group: indexnow
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore last submitted fingerprints
        uses: actions/cache/restore@v6
        with:
          path: indexnow-last.json
          key: indexnow-last-${{ github.run_id }}
          restore-keys: indexnow-last-
      # Vercel builds and promotes a push in about 2-3 minutes.
      - if: ${{ github.event_name == 'push' }}
        run: sleep 240
      - name: Submit changed pages
        id: submit
        run: node scripts/indexnow/run.ts --state indexnow-last.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save fingerprints
        if: ${{ steps.submit.outputs.saved == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: indexnow-last.json
          key: indexnow-last-${{ github.run_id }}
